<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inventory Hub" />
    <title>Inventory Hub - Mobile Inventory Counting & Audit</title>
    <meta name="description" content="Inventory Hub mobile inventory audit PWA with Google Sheets integration, barcode scanning, offline caching, and monitoring." />
    <meta property="og:title" content="Inventory Hub - Mobile Inventory Counting & Audit" />
    <meta property="og:description" content="Inventory Hub mobile inventory audit PWA with Google Sheets integration, barcode scanning, offline caching, and monitoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --theme-bg: #F8FAFC;
        --theme-sidebar: #FFFFFF;
        --theme-card: #FFFFFF;
        --theme-well: #F1F5F9;
        --theme-border: #E2E8F0;
        --theme-text: #0F172A;
        --theme-text-secondary: #334155;
        --theme-text-muted: #64748B;
        --theme-primary: #2563EB;
        background-color: var(--theme-bg);
        color: var(--theme-text);
        color-scheme: light;
      }
      html.dark {
        --theme-bg: #0B1220;
        --theme-sidebar: #111827;
        --theme-card: #1E293B;
        --theme-well: #111827;
        --theme-border: #334155;
        --theme-text: #F1F5F9;
        --theme-text-secondary: #CBD5E1;
        --theme-text-muted: #94A3B8;
        --theme-primary: #60A5FA;
        background-color: var(--theme-bg);
        color: var(--theme-text);
        color-scheme: dark;
      }
      body {
        background-color: var(--theme-bg);
        color: var(--theme-text);
        margin: 0;
      }
    </style>
    <script>
      (function() {
        try {
          var docEl = document.documentElement;
          docEl.classList.add('preload-no-transitions');
          var savedMode = localStorage.getItem('countsheet_appearance_mode');
          var saved = localStorage.getItem('countsheet_theme');
          var validWinThemes = [
            'default','midnight_professional','emerald_operations',
            'christmas','halloween','valentines','new_year'
          ];
          var rawWinTheme = localStorage.getItem('countsheet_bg_icon_theme') || 'default';
          var savedWinTheme = validWinThemes.indexOf(rawWinTheme) !== -1 ? rawWinTheme : 'default';
          docEl.setAttribute('data-window-theme', savedWinTheme);
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedMode === 'dark'
            ? true
            : savedMode === 'light'
            ? false
            : savedMode === 'system'
            ? Boolean(systemDark)
            : (saved === 'dark' ? true : saved === 'light' ? false : Boolean(systemDark));
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            docEl.classList.add('dark');
            docEl.setAttribute('data-theme', 'dark');
            docEl.style.colorScheme = 'dark';
            if (metaTheme) metaTheme.setAttribute('content', '#0B1220');
          } else {
            docEl.classList.remove('dark');
            docEl.setAttribute('data-theme', 'light');
            docEl.style.colorScheme = 'light';
            if (metaTheme) metaTheme.setAttribute('content', '#F8FAFC');
          }
          var enableTransitions = function() {
            requestAnimationFrame(function() {
              requestAnimationFrame(function() {
                docEl.classList.remove('preload-no-transitions');
              });
            });
          };
          if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', enableTransitions, { once: true });
          } else {
            enableTransitions();
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
