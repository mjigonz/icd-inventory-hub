<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inventory Hub" />
    <title>Inventory Hub - Mobile Inventory Counting & Audit</title>
    <meta name="description" content="Inventory Hub mobile inventory audit PWA with Google Sheets integration, barcode scanning, offline caching, and monitoring." />
    <meta property="og:title" content="Inventory Hub - Mobile Inventory Counting & Audit" />
    <meta property="og:description" content="Inventory Hub mobile inventory audit PWA with Google Sheets integration, barcode scanning, offline caching, and monitoring." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('countsheet_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#090D16';
            document.documentElement.style.color = '#F8FAFC';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#F8FAFC';
            document.documentElement.style.color = '#0F172A';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
